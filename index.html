<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Birthday Envelope</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
    }

    .container {
        perspective: 1000px;
    }

    .envelope {
        width: 320px;
        height: 220px;
        position: relative;
        cursor: pointer;
        transform-style: preserve-3d;
    }

    .body {
        width: 100%;
        height: 100%;
        background: #fff;
        border-radius: 10px;
        position: absolute;
        bottom: 0;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .flap {
        width: 100%;
        height: 50%;
        background: #ff4d6d;
        position: absolute;
        top: 0;
        transform-origin: top;
        transition: transform 0.6s;
        border-radius: 10px 10px 0 0;
    }

    .letter {
        position: absolute;
        width: 90%;
        height: 90%;
        background: #fff;
        top: 5%;
        left: 5%;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        transform: translateY(100%);
        transition: 0.6s;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .letter h2 {
        color: #ff4d6d;
        margin-bottom: 10px;
    }

    .open .flap {
        transform: rotateX(180deg);
    }

    .open .letter {
        transform: translateY(0);
    }

    .heart {
        font-size: 24px;
        animation: beat 1s infinite;
    }

    @keyframes beat {
        0%,100% { transform: scale(1); }
        50% { transform: scale(1.3); }
    }
</style>
</head>

<body>

<div class="container">
    <div class="envelope" onclick="toggleEnvelope(this)">
        <div class="flap"></div>
        <div class="body"></div>

        <div class="letter">
            <h2>Happy Birthday 🎉</h2>
            <p>
                Wishing you a day filled with happiness,<br>
                love, and unforgettable moments 💖
            </p>
            <p class="heart">❤️</p>
        </div>
    </div>
</div>

<script>
function toggleEnvelope(el) {
    el.classList.toggle("open");
}
</script>

</body>
</html>
