<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>kitty gang Server welcome card</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#5865F2,#23272A);
        overflow:hidden;
    }

    .card{
        width:340px;
        padding:30px;
        border-radius:25px;
        background:rgba(255,255,255,0.1);
        backdrop-filter:blur(15px);
        border:1px solid rgba(255,255,255,0.2);
        text-align:center;
        color:white;
        box-shadow:0 10px 30px rgba(0,0,0,0.4);
        animation:float 3s ease-in-out infinite;
    }

    @keyframes float{
        0%{transform:translateY(0px);}
        50%{transform:translateY(-10px);}
        100%{transform:translateY(0px);}
    }

    .avatar{
        width:110px;
        height:110px;
        border-radius:50%;
        border:4px solid white;
        margin-bottom:15px;
        object-fit:cover;
    }

    h1{
        font-size:28px;
        margin-bottom:10px;
    }

    p{
        color:#ddd;
        font-size:15px;
        line-height:1.5;
    }

    .badge{
        display:inline-block;
        margin-top:15px;
        padding:8px 18px;
        background:#5865F2;
        border-radius:30px;
        font-size:14px;
        font-weight:bold;
        box-shadow:0 0 15px rgba(88,101,242,0.7);
    }

    .btn{
        display:inline-block;
        margin-top:22px;
        padding:12px 28px;
        background:white;
        color:#5865F2;
        text-decoration:none;
        border-radius:30px;
        font-weight:bold;
        transition:0.3s;
    }

    .btn:hover{
        transform:scale(1.08);
        background:#e9ecff;
    }
</style>
</head>

<body>

<div class="card">
    <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" class="avatar">

    <h1>GG SERVER</h1>

    <p>
        Welcome to our awesome Discord community 💜<br>
        Stay active, make friends, and enjoy the vibes.
    </p>

    <div class="badge">✨ Loyal Member ✨</div>

    <br>

    <a href="#" class="btn">Join The Fun</a>
</div>

</body>
</html>
